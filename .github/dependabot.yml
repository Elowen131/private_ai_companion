# Dependabot：定期扫描依赖与 GitHub Actions，自动发起升级 PR。
version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # 归组：把多个 pub 升级合并为单个 PR，避免面板被大量独立 PR 刷屏。
    # 注意：major 版本升级（如 get_it 7->9、flutter_secure_storage 9->11、
    # flutter_lints 3->6、cupertino_icons 1->2）通常带 breaking change，
    # 不能自动合并——CI 会失败（这是预期的保护），需人工改写调用代码后再合入。
    groups:
      pub-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/.github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
