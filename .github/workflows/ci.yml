# 持续集成 / 持续交付流水线
# 触发：推送到 main / dev、以及针对这两分支的 PR。
# 目标：无人值守校验「代码质量 → 单元测试 → Android / iOS 生产构建可编译」。
#
# 注意：
#  - 生产签名密钥（android/app/keystore/release.keystore、android/key.properties）
#    已被 .gitignore 忽略，不会进入仓库，也不会注入到本 CI。无密钥时 release 构建
#    会自动回退到 debug 签名（仅用于「能否编译」的验证，不可上架）。
#  - 如需在 CI 产出可上架产物，请用仓库 Secrets 注入签名（见 docs/ops-ci-setup.md）。
#  - NDK 版本须与本地 Flutter 默认 ndkVersion 严格一致（Flutter 3.47.9 -> 28.2.13676358，
#    见 FlutterExtension.kt）。版本不匹配会导致 llm_llamacpp 等原生插件构建失败。
#  - iOS 在 CI 用 `--no-codesign` 仅做编译校验；真机/上架签名需在本地 macOS + Xcode 配置
#    Development Team（见 docs/ops-ci-setup.md）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"   # 与本地开发环境保持一致；升级 Flutter 时同步此处
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"   # 必须与 Flutter 默认 ndkVersion 一致（见 FlutterExtension.kt）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量门禁：静态分析 + 单元测试
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Print versions
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Install system SQLite (FFI backend on Linux)
        # sqflite_common_ffi 的 FFI 后端在 Linux 上需要 libsqlite3；ubuntu runner 默认
        # 可能缺失，缺失会导致数据库测试在 CI 上 MissingPlugin/加载失败。
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos

      - name: Test
        # 测试套件约 300+ 项；flutter_test_config.dart 已全局把 databaseFactory 切到
        # FFI 真 SQLite，不依赖 Android/iOS 原生加密插件（Linux CI 无该原生实现）。
        # 禁止代理以规避沙箱网络拦截。
        run: flutter test
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""

  # ---------------------------------------------------------------------------
  # 2) 生产构建可编译性校验（Android）
  #    无签名密钥时回退 debug 签名，仅验证 release 构建链路能跑通。
  #    同时产出 APK（侧载/分发验证）与 AAB（Google Play 上架标准产物）。
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (release, verify compile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Install NDK (llm_llamacpp 等原生插件需要，须与 flutter.ndkVersion 一致)
        # 若与本地 flutter.ndkVersion 不符，请把 env.NDK_VERSION 改为本地
        # `flutter doctor` 提示的版本（或 FlutterExtension.kt 中的默认值）。
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (no signing -> debug-sign fallback)
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store artifact)
        run: flutter build appbundle --release

      - name: Upload APK artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload AAB artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) 生产构建可编译性校验（iOS）
  #    使用 --no-codesign 仅做编译校验，不产出可上架的签名包；
  #    真机/App Store 签名需在本地 macOS + Xcode 配置 Development Team。
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (release, verify compile)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install CocoaPods
        # GitHub macOS runner 未必预装 cocoapods，flutter build ios 需要它执行 pod install。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        # ios/Podfile 已就位；首次 pod install 需在 macOS runner 上拉取 spec 仓库，
        # 这里显式执行以确保 sqflite_sqlcipher 等原生 pod 接入工程。
        run: cd ios && pod install

      - name: Build iOS (no code signing -> compile verification only)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: ignore
