# 持续集成 / 持续交付流水线
# 触发：推送到 main / dev、以及针对这两分支的 PR。
# 目标：无人值守校验「代码质量 → 单元测试 → Android / iOS 生产构建可编译」。
#
# 注意：
#  - 生产签名密钥（android/app/keystore/release.keystore、android/key.properties）
#    已被 .gitignore 忽略，不会进入仓库，也不会注入到本 CI。无密钥时 release 构建
#    会自动回退到 debug 签名（仅用于「能否编译」的验证，不可上架）。
#  - 如需在 CI 产出可上架产物，请用仓库 Secrets 注入签名（见 docs/ops-ci-setup.md）。
#  - NDK 版本须与本地 Flutter 默认 ndkVersion 严格一致（Flutter 3.47.9 -> 28.2.13676358，
#    见 FlutterExtension.kt）。版本不匹配会导致 llamadart 等原生插件构建失败。
#  - iOS 在 CI 用 `flutter build ios --simulator` 仅做编译校验（无需 Apple 账号 /
#    Development Team）。真机 / App Store 签名需在本地 macOS + Xcode 配置
#    Development Team（见 docs/ops-ci-setup.md）。
#  - Android 直接用 GitHub ubuntu runner 预装的 Android SDK + sdkmanager 安装 NDK 与
#    compileSdk 平台，不再使用 android-actions/setup-android（其会安装已下架的 tools 包而失败）。
#  - iOS 端侧推理底座已从 llm_llamacpp 迁移到 llamadart：llm_llamacpp 0.7.0 的 iOS 原生库
#    路径损坏（预编译包缺 llama.framework、源码构建不产出 framework 目录、hook 每次强制
#    重下载覆盖缓存），无法在 CI 构建；llamadart 自带维护良好的 iOS 原生资产（XCFramework +
#    SwiftPM 伴侣包 llamadart_llama_cpp_flutter），`flutter build ios` 会自动解析，无需本仓库
#    手动编译 / 注入。llamadart 要求 iOS 部署目标 >= 16.4（已在 Podfile 与 project.pbxproj 设置）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"   # 与本地开发环境保持一致；升级 Flutter 时同步此处
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"   # 必须与 Flutter 默认 ndkVersion 一致（见 FlutterExtension.kt）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量门禁：静态分析 + 单元测试
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Print versions
        run: flutter --version

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Install system deps (FFI SQLite + Flutter Linux test runtime)
        # 1) libsqlite3-dev：sqflite_common_ffi 的 FFI 后端在 Linux 上需要 libsqlite3。
        # 2) GTK / GL / NSS 等：flutter test 在 Linux 上跑 widget / UI 测试需要 GTK-3、
        #    OpenGL、NSS 等图形运行时；ubuntu runner 默认缺失会导致 UI 测试在 CI 上
        #    渲染阶段崩溃（本地 Windows / macOS 因自带图形栈而能过）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            libgtk-3-0 libgl1 libnss3 libxss1 libgbm1 libjsoncpp-dev

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos

      - name: Test
        # 测试套件约 300+ 项；flutter_test_config.dart 已全局把 databaseFactory 切到
        # FFI 真 SQLite，不依赖 Android/iOS 原生加密插件（Linux CI 无该原生实现）。
        run: flutter test

  # ---------------------------------------------------------------------------
  # 2) 生产构建可编译性校验（Android）
  #    无签名密钥时回退 debug 签名，仅验证 release 构建链路能跑通。
  #    同时产出 APK（侧载/分发验证）与 AAB（Google Play 上架标准产物）。
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (release, verify compile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Android SDK & NDK (use runner's preinstalled SDK)
        # GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 已设）。
        # 不再使用 android-actions/setup-android@v3：该 action 会尝试安装已被仓库
        # 移除的 legacy 'tools' 包，报 "Failed to find package 'tools'" 而失败。
        # 这里直接用内置 sdkmanager 接受许可证，并安装 NDK 与 compileSdk 平台
        # （Flutter 3.47.9 -> compileSdk/targetSdk=36，ndkVersion=28.2.13676358）。
        run: |
          # 动态定位 sdkmanager（runner 的 cmdline-tools 子目录可能是 latest 或版本号如 16.0）。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          export PATH="$(dirname "$SDKMGR"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;${{ env.NDK_VERSION }}"

      - name: Free up disk space (avoid "Could not update last-build.bin" on the 14GB runner)
        # GitHub ubuntu-latest runner 仅 ~14GB 磁盘；llamadart 通过 NDK 编译 llama.cpp
        # 原生库会产生大量中间产物，加上预装的 dotnet / CodeQL 等占用，易把盘写满，
        # 导致 Gradle 末尾写缓存文件失败。
        # ！！重要：/opt/hostedtoolcache（即 $AGENT_TOOLSDIRECTORY）里装着 Flutter SDK 与
        # JDK，绝不能删——上一步曾误删整个 toolcache 导致 flutter: command not found。
        # 这里只删与 Android 构建无关的预装大目录：dotnet 与 CodeQL 子目录。
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (no signing -> debug-sign fallback)
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store artifact)
        run: flutter build appbundle --release

      - name: Upload APK artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload AAB artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) 生产构建可编译性校验（iOS）
  #    使用 --simulator 仅做编译校验，不产出可上架的签名包；
  #    真机/App Store 签名需在本地 macOS + Xcode 配置 Development Team。
  #    端侧推理底座为 llamadart（已替代 llm_llamacpp）：其自带维护的 iOS 原生资产，
  #    flutter build ios 会自动解析，无需本仓库手动编译 / 注入。
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (release, verify compile)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install CocoaPods
        # GitHub macOS runner 未必预装 cocoapods，flutter build ios 需要它执行 pod install。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Enable iOS build target
        # macOS runner 上需显式开启 iOS 构建支持，否则 flutter build ios 直接报错。
        run: flutter config --enable-ios

      - name: Accept Xcode license
        # 未授权的 Xcode 会让 xcodebuild / flutter build ios 失败；CI 上必须主动接受。
        run: sudo xcodebuild -license accept

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build iOS (simulator -> compile verification, no Apple Team needed)
        # 真机/上架需要 Development Team + Provisioning Profile；CI 无 Apple 账号，
        # 改用模拟器构建做编译校验（不需要签名/Team）。
        # llamadart 的 iOS 原生资产（XCFramework）由 flutter build ios 自动解析并嵌入，
        # 其 SwiftPM 伴侣包 llamadart_llama_cpp_flutter 已在 pubspec 中声明。
        # flutter build ios 内部自动执行 pod install（ios/Podfile 已就位，部署目标 16.4）。
        run: flutter build ios --simulator

      - name: Upload iOS app artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: ignore
