# 持续集成 / 持续交付流水线
# 触发：推送到 main / dev、以及针对这两分支的 PR。
# 目标：无人值守校验「代码质量 → 单元测试 → Android / iOS 生产构建可编译」。
#
# 注意：
#  - 生产签名密钥（android/app/keystore/release.keystore、android/key.properties）
#    已被 .gitignore 忽略，不会进入仓库，也不会注入到本 CI。无密钥时 release 构建
#    会自动回退到 debug 签名（仅用于「能否编译」的验证，不可上架）。
#  - 如需在 CI 产出可上架产物，请用仓库 Secrets 注入签名（见 docs/ops-ci-setup.md）。
#  - NDK 版本须与本地 Flutter 默认 ndkVersion 严格一致（Flutter 3.47.9 -> 28.2.13676358，
#    见 FlutterExtension.kt）。版本不匹配会导致 llm_llamacpp 等原生插件构建失败。
#  - iOS 在 CI 用 `flutter build ios --simulator` 仅做编译校验（无需 Apple 账号 /
#    Development Team）。真机 / App Store 签名需在本地 macOS + Xcode 配置
#    Development Team（见 docs/ops-ci-setup.md）。
#  - Android 直接用 GitHub ubuntu runner 预装的 Android SDK + sdkmanager 安装 NDK 与
#    compileSdk 平台，不再使用 android-actions/setup-android（其会安装已下架的 tools 包而失败）。
#  - iOS 的 llm_llamacpp 原生库：该包 0.7.0 的 iOS 路径损坏（预编译包缺 llama.framework、
#    源码构建又不产出 framework 目录），故 CI 在 macOS runner 上自行用锁定的 llama.cpp
#    提交编译出可用 llama.framework 并注入（见 build-ios 步骤与 ci-scripts/patch_llamacpp_hook.py）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"   # 与本地开发环境保持一致；升级 Flutter 时同步此处
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"   # 必须与 Flutter 默认 ndkVersion 一致（见 FlutterExtension.kt）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量门禁：静态分析 + 单元测试
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Print versions
        run: flutter --version

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Install system deps (FFI SQLite + Flutter Linux test runtime)
        # 1) libsqlite3-dev：sqflite_common_ffi 的 FFI 后端在 Linux 上需要 libsqlite3。
        # 2) GTK / GL / NSS 等：flutter test 在 Linux 上跑 widget / UI 测试需要 GTK-3、
        #    OpenGL、NSS 等图形运行时；ubuntu runner 默认缺失会导致 UI 测试在 CI 上
        #    渲染阶段崩溃（本地 Windows / macOS 因自带图形栈而能过）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            libgtk-3-0 libgl1 libnss3 libxss1 libgbm1 libjsoncpp-dev

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos

      - name: Test
        # 测试套件约 300+ 项；flutter_test_config.dart 已全局把 databaseFactory 切到
        # FFI 真 SQLite，不依赖 Android/iOS 原生加密插件（Linux CI 无该原生实现）。
        run: flutter test

  # ---------------------------------------------------------------------------
  # 2) 生产构建可编译性校验（Android）
  #    无签名密钥时回退 debug 签名，仅验证 release 构建链路能跑通。
  #    同时产出 APK（侧载/分发验证）与 AAB（Google Play 上架标准产物）。
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (release, verify compile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Android SDK & NDK (use runner's preinstalled SDK)
        # GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 已设）。
        # 不再使用 android-actions/setup-android@v3：该 action 会尝试安装已被仓库
        # 移除的 legacy 'tools' 包，报 "Failed to find package 'tools'" 而失败。
        # 这里直接用内置 sdkmanager 接受许可证，并安装 NDK 与 compileSdk 平台
        # （Flutter 3.47.9 -> compileSdk/targetSdk=36，ndkVersion=28.2.13676358）。
        run: |
          # 动态定位 sdkmanager（runner 的 cmdline-tools 子目录可能是 latest 或版本号如 16.0）。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          export PATH="$(dirname "$SDKMGR"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;${{ env.NDK_VERSION }}"

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (no signing -> debug-sign fallback)
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store artifact)
        run: flutter build appbundle --release

      - name: Upload APK artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload AAB artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) 生产构建可编译性校验（iOS）
  #    使用 --simulator 仅做编译校验，不产出可上架的签名包；
  #    真机/App Store 签名需在本地 macOS + Xcode 配置 Development Team。
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (release, verify compile)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install CocoaPods
        # GitHub macOS runner 未必预装 cocoapods，flutter build ios 需要它执行 pod install。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Enable iOS build target
        # macOS runner 上需显式开启 iOS 构建支持，否则 flutter build ios 直接报错。
        run: flutter config --enable-ios

      - name: Accept Xcode license
        # 未授权的 Xcode 会让 xcodebuild / flutter build ios 失败；CI 上必须主动接受。
        run: sudo xcodebuild -license accept

      - name: Pub get
        run: flutter pub get

      - name: Build llama.framework (iOS simulator) & inject into llm_llamacpp hook
        # 根因（已确认，非本仓库配置问题）：llm_llamacpp 0.7.0 的 iOS 原生库路径
        # 完全损坏——其 GitHub Release 的 ios-arm64 预编译包缺失 llama.framework，
        # 而源码构建分支只产出 libllama.dylib、iOS 收集器却要求 llama.framework 目录，
        # 两条路在 iOS 上都会失败（android/linux/macos/windows 是单文件，正常）。
        # 解决办法：在 macOS runner 上用锁定的 llama.cpp 提交（0.7.0 标签子模块指针）
        # 为 iOS 模拟器 SDK 编译出可用的 llama.framework（+ ggml 依赖 dylib），再用
        # ci-scripts/patch_llamacpp_hook.py 给 hook 打一个「安全」补丁（仅插入一个
        # 函数 + 改一处调用，不做括号配对，不会破坏文件），让 hook 优先读取
        # LLM_LLAMACPP_PREBUILT 目录，从而绕开上游损坏的预编译/源码构建逻辑。
        # CI 仅为编译校验（flutter build ios --simulator，不上架），故此处用
        # CPU-only（关闭 Metal）降低 Metal toolchain 在 CI 上的风险；真机/上架所需的
        # Metal 版本由你在本机/发布流程自行构建。
        env:
          LLAMACPP_COMMIT: "25ae3a9b331fffea50ff8d07a5cad34c33f1276f"
        run: |
          set -euo pipefail
          # 1) 定位包与 llama.cpp 源码
          PKG=$(find "$HOME/.pub-cache" -type d -name 'llm_llamacpp-0.7.0' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::llm_llamacpp package not found in pub cache"
            exit 1
          fi
          LLAMACPP_SRC="$PKG/llamacpp"
          if [ ! -e "$LLAMACPP_SRC/CMakeLists.txt" ]; then
            rm -rf "$LLAMACPP_SRC"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ggml-org/llama.cpp.git "$LLAMACPP_SRC"
            git -C "$LLAMACPP_SRC" fetch --depth 1 origin "$LLAMACPP_COMMIT"
            git -C "$LLAMACPP_SRC" checkout "$LLAMACPP_COMMIT"
          fi

          # 2) 用 CMake 为 iOS 模拟器（arm64）编译 llama.cpp（CPU-only）
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          BUILD="$RUNNER_TEMP/llama-ios-sim-build"
          PREBUILT="$RUNNER_TEMP/llama-prebuilt"
          rm -rf "$BUILD" "$PREBUILT"
          mkdir -p "$BUILD" "$PREBUILT"
          cmake -S "$LLAMACPP_SRC" -B "$BUILD" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_CURL=OFF \
            -DGGML_METAL=OFF -DGGML_BLAS=OFF -DGGML_ACCELERATE=OFF
          cmake --build "$BUILD" --config Release

          # 3) 组装 llama.framework + 复制 ggml 依赖 dylib，并修复 install name
          mkdir -p "$PREBUILT/llama.framework"
          LIBLLAMA=$(find "$BUILD" -name 'libllama.dylib' | head -1)
          if [ -z "$LIBLLAMA" ]; then
            echo "::error::libllama.dylib not produced by CMake build"
            exit 1
          fi
          cp "$LIBLLAMA" "$PREBUILT/llama.framework/llama"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>llama</string>' \
            '  <key>CFBundleIdentifier</key><string>com.lowlevel.llama</string>' \
            '  <key>CFBundleVersion</key><string>1.0</string>' \
            '  <key>CFBundlePackageType</key><string>FMWK</string>' \
            '  <key>CFBundleExecutable</key><string>llama</string>' \
            '  <key>MinimumOSVersion</key><string>14.0</string>' \
            '</dict>' \
            '</plist>' > "$PREBUILT/llama.framework/Info.plist"
          # 复制 ggml 依赖 dylib（不要复制 libllama，框架内已含）
          find "$BUILD" -name 'libggml*.dylib' -exec cp {} "$PREBUILT/" \;
          # 修复 install name：让依赖通过 @rpath 解析，便于 Flutter 嵌入
          for f in "$PREBUILT"/*.dylib; do
            base=$(basename "$f")
            install_name_tool -id "@rpath/$base" "$f" 2>/dev/null || true
          done
          install_name_tool -id "@rpath/llama.framework/llama" \
            "$PREBUILT/llama.framework/llama" 2>/dev/null || true
          for dep in "$PREBUILT"/*.dylib; do
            depbase=$(basename "$dep")
            install_name_tool -change "$LIBLLAMA" "@rpath/$depbase" \
              "$PREBUILT/llama.framework/llama" 2>/dev/null || true
            install_name_tool -change "$(dirname "$LIBLLAMA")/$depbase" \
              "@rpath/$depbase" "$PREBUILT/llama.framework/llama" 2>/dev/null || true
          done
          echo "Prebuilt dir:"; ls -la "$PREBUILT"
          echo "Framework:"; ls -la "$PREBUILT/llama.framework"

          # 4) 安全补丁：让 hook 优先读取 LLM_LLAMACPP_PREBUILT
          python3 ci-scripts/patch_llamacpp_hook.py "$PKG/hook/build.dart"

          # 5) 把预编译目录暴露给后续 build 步骤，并清掉 hooks 缓存强制重编译
          echo "LLM_LLAMACPP_PREBUILT=$PREBUILT" >> "$GITHUB_ENV"
          rm -rf .dart_tool/hooks_runner

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build iOS (simulator -> compile verification, no Apple Team needed)
        # 真机/上架需要 Development Team + Provisioning Profile；CI 无 Apple 账号，
        # 改用模拟器构建做编译校验（不需要签名/Team）。上一阶段已自行编译出
        # llama.framework 并注入，hook 会优先使用（见上方步骤），从而绕开上游损坏逻辑。
        # flutter build ios 内部自动执行 pod install（ios/Podfile 已就位）。
        run: flutter build ios --simulator

      - name: Upload iOS app artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: ignore
