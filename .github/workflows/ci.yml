# 持续集成 / 持续交付流水线
# 触发：推送到 main / dev、以及针对这两分支的 PR。
# 目标：无人值守校验「代码质量 → 单元测试 → Android / iOS 生产构建可编译」。
#
# 注意：
#  - 生产签名密钥（android/app/keystore/release.keystore、android/key.properties）
#    已被 .gitignore 忽略，不会进入仓库，也不会注入到本 CI。无密钥时 release 构建
#    会自动回退到 debug 签名（仅用于「能否编译」的验证，不可上架）。
#  - 如需在 CI 产出可上架产物，请用仓库 Secrets 注入签名（见 docs/ops-ci-setup.md）。
#  - NDK 版本须与本地 Flutter 默认 ndkVersion 严格一致（Flutter 3.47.9 -> 28.2.13676358，
#    见 FlutterExtension.kt）。版本不匹配会导致 llamadart 等原生插件构建失败。
#  - iOS 在 CI 用 `flutter build ios --simulator` 仅做编译校验（无需 Apple 账号 /
#    Development Team）。真机 / App Store 签名需在本地 macOS + Xcode 配置
#    Development Team（见 docs/ops-ci-setup.md）。
#  - Android 直接用 GitHub ubuntu runner 预装的 Android SDK + sdkmanager 安装 NDK 与
#    compileSdk 平台，不再使用 android-actions/setup-android（其会安装已下架的 tools 包而失败）。
#  - Gradle wrapper 三件套（android/gradlew、gradlew.bat、gradle/wrapper/gradle-wrapper.jar）
#    必须随仓库入库：Flutter 模板的 android/.gitignore 默认忽略它们，本机虽存在（本地生成），
#    CI checkout 后却没有，`./gradlew` 会报 "No such file or directory"。行尾与可执行位
#    由根 .gitattributes + git 100755 约束，与开发者本机 git 配置无关。
#  - Gradle wrapper 分发版（gradle-9.3.1-all.zip，约 225MB）单独用 actions/cache 缓存，
#    并带预热重试：services.gradle.org 会 302 到 GitHub Releases，代理偶发 502/504
#    会在冷启动时直接打断 assembleRelease；flutter-action 的 cache:true 不覆盖该目录。
#    预热步骤只对匹配 5xx/超时的瞬时故障重试，文件缺失/权限/其它错误立即失败。
#  - iOS 端侧推理底座已从 llm_llamacpp 迁移到 llamadart：llm_llamacpp 0.7.0 的 iOS 原生库
#    路径损坏（预编译包缺 llama.framework、源码构建不产出 framework 目录、hook 每次强制
#    重下载覆盖缓存），无法在 CI 构建；llamadart 自带维护良好的 iOS 原生资产（XCFramework +
#    SwiftPM 伴侣包 llamadart_llama_cpp_flutter），`flutter build ios` 会自动解析，无需本仓库
#    手动编译 / 注入。llamadart 要求 iOS 部署目标 >= 16.4（已在 Podfile 与 project.pbxproj 设置）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # 手动触发：workflow 修好后可在最新提交上直接起一条干净运行，无需空提交。
  # 注意：对旧失败任务点 "Re-run jobs" 会沿用原始 SHA 和原始 workflow 文件，
  # 即使仓库已经修复，重跑仍会复现旧报错（例如旧的 gradlew 五连重试）。
  # 遇到「日志里的脚本和仓库里不一致」时，一律用 push 或此处手动触发新运行。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"   # 与本地开发环境保持一致；升级 Flutter 时同步此处
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"   # 必须与 Flutter 默认 ndkVersion 一致（见 FlutterExtension.kt）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量门禁：静态分析 + 单元测试
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Print versions
        run: flutter --version

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Install system deps (FFI SQLite + Flutter Linux test runtime)
        # 1) libsqlite3-dev：sqflite_common_ffi 的 FFI 后端在 Linux 上需要 libsqlite3。
        # 2) GTK / GL / NSS 等：flutter test 在 Linux 上跑 widget / UI 测试需要 GTK-3、
        #    OpenGL、NSS 等图形运行时；ubuntu runner 默认缺失会导致 UI 测试在 CI 上
        #    渲染阶段崩溃（本地 Windows / macOS 因自带图形栈而能过）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            libgtk-3-0 libgl1 libnss3 libxss1 libgbm1 libjsoncpp-dev

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos

      - name: Test
        # 测试套件约 300+ 项；flutter_test_config.dart 已全局把 databaseFactory 切到
        # FFI 真 SQLite，不依赖 Android/iOS 原生加密插件（Linux CI 无该原生实现）。
        run: flutter test

  # ---------------------------------------------------------------------------
  # 2) 生产构建可编译性校验（Android）
  #    无签名密钥时回退 debug 签名，仅验证 release 构建链路能跑通。
  #    同时产出 APK（侧载/分发验证）与 AAB（Google Play 上架标准产物）。
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (release, verify compile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Android SDK & NDK (use runner's preinstalled SDK)
        # GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 已设）。
        # 不再使用 android-actions/setup-android@v3：该 action 会尝试安装已被仓库
        # 移除的 legacy 'tools' 包，报 "Failed to find package 'tools'" 而失败。
        # 这里直接用内置 sdkmanager 接受许可证，并安装 NDK 与 compileSdk 平台
        # （Flutter 3.47.9 -> compileSdk/targetSdk=36，ndkVersion=28.2.13676358）。
        run: |
          # 动态定位 sdkmanager（runner 的 cmdline-tools 子目录可能是 latest 或版本号如 16.0）。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          export PATH="$(dirname "$SDKMGR"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;${{ env.NDK_VERSION }}"

      - name: Free up disk space (avoid "Could not update last-build.bin" on the 14GB runner)
        # GitHub ubuntu-latest runner 仅 ~14GB 磁盘；llamadart 通过 NDK 编译 llama.cpp
        # 原生库会产生大量中间产物，加上预装的 dotnet / CodeQL 等占用，易把盘写满，
        # 导致 Gradle 末尾写缓存文件失败。
        # ！！重要：/opt/hostedtoolcache（即 $AGENT_TOOLSDIRECTORY）里装着 Flutter SDK 与
        # JDK，绝不能删——上一步曾误删整个 toolcache 导致 flutter: command not found。
        # 这里只删与 Android 构建无关的预装大目录：dotnet 与 CodeQL 子目录。
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Cache Gradle distribution
        # gradle-9.3.1-all.zip 约 225MB，services.gradle.org 会 302 到
        # github.com/gradle/gradle-distributions/releases/download/...；代理偶发
        # 502/504 会让 gradlew 在 1s 内直接失败（曾报 "Server returned HTTP
        # response code: 504"）。subosito/flutter-action 的 cache:true 只缓存
        # Flutter SDK 与 pub 包，不覆盖 ~/.gradle/wrapper/dists，故这里单独缓存。
        # 缓存命中后整条构建链路不再触碰该域名。
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Warm Gradle wrapper (validate files, retry on transient 502/504)
        # 前置校验比重试更重要：Flutter 模板的 android/.gitignore 曾忽略 gradlew /
        # gradlew.bat / gradle-wrapper.jar，CI checkout 后 `./gradlew` 直接报
        # "No such file or directory"，盲目重试 5 次只会白等 100s 并误判成网络故障。
        # 这里先断言三件套、补可执行位（Windows core.filemode=false 会丢 +x）与 LF
        # 行尾（CRLF 会让 Linux 报 bad interpreter），再只对瞬时网络错误做退避重试。
        run: |
          set -euo pipefail
          echo "::notice::Gradle warm-up on ${GITHUB_SHA:-unknown} (${GITHUB_REF:-unknown})"
          cd android
          LOG="${RUNNER_TEMP:-/tmp}/gradlew-warm.log"
          for f in ./gradlew ./gradlew.bat gradle/wrapper/gradle-wrapper.jar; do
            test -f "$f" || {
              echo "::error::$f 未随仓库检出；检查 .gitignore / .gitattributes，勿误判为网络 502/504"
              exit 1
            }
          done
          chmod +x ./gradlew
          if LC_ALL=C grep -q $'\r' ./gradlew; then
            echo "::warning::gradlew 含 CRLF，已就地转为 LF（.gitattributes 应已保证 eol=lf）"
            sed -i 's/\r$//' ./gradlew
          fi
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version > "$LOG" 2>&1; then
              echo "Gradle wrapper ready (attempt $attempt)"
              grep -A2 '^Gradle ' "$LOG" || true
              exit 0
            fi
            tail -n 12 "$LOG" || true
            if ! grep -Eq 'HTTP response code: (50[0-9]|42[0-9])|502|504|Connection (reset|timed out)|Read timed out|SocketTimeout|Could not (download|GET|resolve)' "$LOG"; then
              echo "::error::Gradle wrapper 启动失败且非瞬时网络故障（见上方日志），立即终止重试"
              exit 1
            fi
            echo "::warning::Gradle distribution download failed (attempt $attempt/5)"
            find "$HOME/.gradle/wrapper/dists" -name '*.part' -delete 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Gradle 9.3.1 distribution unavailable after 5 attempts (proxy 502/504?)"
          exit 1

      - name: Pub get
        run: flutter pub get

      - name: Patch flutter_inappwebview proguard (AGP incompatibility workaround)
        # flutter_inappwebview_android 1.1.3（flutter_3d_controller 的传递依赖）的
        # android/build.gradle 调用了 getDefaultProguardFile('proguard-android.txt')，
        # 新版 AGP（随 Flutter 3.47.9 捆绑）在评估阶段直接拒绝该调用，导致
        # `flutter build apk/aab` 构建失败（与是否 --obfuscate 无关）。此处改写为
        # AGP 推荐的 proguard-android-optimize.txt（release 安全，无行为变化）。
        # 必须在 pub get 之后、build 之前执行；幂等，仅当旧字符串仍存在时改写。
        run: bash tools/patch_inappwebview_proguard.sh

      - name: Build release APK (no signing -> debug-sign fallback)
        # PRD 11.4：按 ABI 分包、arm64-v8a 为主。限定单一目标平台既满足分包，
        # 又避免全 ABI 重复编译 llama.cpp 原生库把 7GB CI runner 拖垮 / OOM。
        # AAB 由 Play 按设备 ABI 下发，无需在此拆分。
        # --obfuscate + --split-debug-info：缩短 Dart AOT 符号、剥离调试信息，
        # 只减小 libapp.so，不动任何原生库 / ABI / 画面（红线 B5/B6）。符号目录
        # 不进 APK，仅作为独立 artifact 留存，用于还原线上混淆后的堆栈。
        run: >-
          flutter build apk --release
          --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/app/dart-symbols/apk

      - name: Verify APK size budget (M1~M4 + M3d, model-not-bundled)
        # 硬断言：单 ABI、flutter_assets 可控 ≤1MB（3D 运行时 model-viewer 单列豁免 ≤1.5MB）、
        # 未压缩总体积 ≤105MB、APK ≤100MB、assets/ 内不得出现 GLB/VRM/GGUF 等模型权重，
        # 且 GPU / WebGPU / OpenCL 后端（含 libLiteRtOpenClAccelerator.so）与 LiteRT CPU 核心不得出现。
        # shrinkResources 裁不到 flutter_assets 与 lib/*.so，必须单独守。
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1)
          fi
          test -f "$APK" || { echo "::error::no release APK produced"; exit 1; }
          python3 tools/check_apk_size.py "$APK"

      - name: Build release App Bundle (Play Store artifact)
        # 与 APK 保持同样的符号分离参数，避免两个交付产物 Dart 快照体积不一致。
        run: >-
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/app/dart-symbols/aab

      - name: Upload Dart obfuscation symbols (not shipped)
        # 仅用于崩溃栈还原，不随 APK/AAB 分发，不影响用户下载体积。
        # 构件存储额度有限（私有仓默认 500MB）：上传失败（配额满）不应让整个
        # 编译校验 job 变红——构建本身已通过，构件只是便于下载的附属品，
        # 故 continue-on-error + 短保留 + 重跑覆盖，避免额度耗尽时 CI 误判失败。
        # 仅 push 到 main/dev 或手动触发时上传；PR 仅做编译校验、不消耗配额，
        # 避免高频 PR 把 500MB 私有仓额度快速吃满（见 #artifact-quota）。
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dart-obfuscation-symbols
          path: build/app/dart-symbols/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload APK artifact (verification only)
        # 仅为方便下载验证产物；构建校验已由前面的 build/upload 步骤完成。
        # 保留期 7 天 + continue-on-error：历史构建易吃满私有仓 500MB 构件额度，
        # 满额时上传失败不应让 job 变红（编译已通过）。
        # 仅 push/main-dev 或手动触发时上传；PR 不传（见 #artifact-quota）。
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          # --split-per-abi 的产物名带 ABI 后缀（app-arm64-v8a-release.apk）。
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload AAB artifact (verification only)
        # 仅为方便下载验证产物；保留期 7 天 + continue-on-error（理由同上）。
        # 仅 push/main-dev 或手动触发时上传；PR 不传（见 #artifact-quota）。
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------------------
  # 3) 生产构建可编译性校验（iOS）
  #    使用 --simulator 仅做编译校验，不产出可上架的签名包；
  #    真机/App Store 签名需在本地 macOS + Xcode 配置 Development Team。
  #    端侧推理底座为 llamadart（已替代 llm_llamacpp）：其自带维护的 iOS 原生资产，
  #    flutter build ios 会自动解析，无需本仓库手动编译 / 注入。
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (release, verify compile)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install CocoaPods
        # GitHub macOS runner 未必预装 cocoapods，flutter build ios 需要它执行 pod install。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Enable iOS build target
        # macOS runner 上需显式开启 iOS 构建支持，否则 flutter build ios 直接报错。
        run: flutter config --enable-ios

      - name: Accept Xcode license
        # 未授权的 Xcode 会让 xcodebuild / flutter build ios 失败；CI 上必须主动接受。
        run: sudo xcodebuild -license accept

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build iOS (simulator -> compile verification, no Apple Team needed)
        # 真机/上架需要 Development Team + Provisioning Profile；CI 无 Apple 账号，
        # 改用模拟器构建做编译校验（不需要签名/Team）。
        # llamadart 的 iOS 原生资产（XCFramework）由 flutter build ios 自动解析并嵌入，
        # 其 SwiftPM 伴侣包 llamadart_llama_cpp_flutter 已在 pubspec 中声明。
        # flutter build ios 内部自动执行 pod install（ios/Podfile 已就位，部署目标 16.4）。
        run: flutter build ios --simulator

      # 注：故意不上传 iOS Runner.app 构件。
      # 原因（#artifact-quota）：模拟器构建的 .app 未签名、无法在真机侧载，
      # 实际下载价值极低；而它体积极大（数百 MB），是吃满私有仓 500MB 构件
      # 额度的主要元凶。iOS「能否编译」已由上面的 build 步骤验证，无需再上传。
      # 若日后确实要分发 iOS 验证包，应改为本地 macOS + 真机签名构建，
      # 而非在 CI 上传模拟器包。
