# 持续集成 / 持续交付流水线
# 触发：推送到 main / dev、以及针对这两分支的 PR。
# 目标：无人值守校验「代码质量 → 单元测试 → Android / iOS 生产构建可编译」。
#
# 注意：
#  - 生产签名密钥（android/app/keystore/release.keystore、android/key.properties）
#    已被 .gitignore 忽略，不会进入仓库，也不会注入到本 CI。无密钥时 release 构建
#    会自动回退到 debug 签名（仅用于「能否编译」的验证，不可上架）。
#  - 如需在 CI 产出可上架产物，请用仓库 Secrets 注入签名（见 docs/ops-ci-setup.md）。
#  - NDK 版本须与本地 Flutter 默认 ndkVersion 严格一致（Flutter 3.47.9 -> 28.2.13676358，
#    见 FlutterExtension.kt）。版本不匹配会导致 llm_llamacpp 等原生插件构建失败。
#  - iOS 在 CI 用 `flutter build ios --simulator` 仅做编译校验（无需 Apple 账号 /
#    Development Team）。真机 / App Store 签名需在本地 macOS + Xcode 配置
#    Development Team（见 docs/ops-ci-setup.md）。
#  - Android 直接用 GitHub ubuntu runner 预装的 Android SDK + sdkmanager 安装 NDK 与
#    compileSdk 平台，不再使用 android-actions/setup-android（其会安装已下架的 tools 包而失败）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"   # 与本地开发环境保持一致；升级 Flutter 时同步此处
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"   # 必须与 Flutter 默认 ndkVersion 一致（见 FlutterExtension.kt）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量门禁：静态分析 + 单元测试
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Print versions
        run: flutter --version

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Install system deps (FFI SQLite + Flutter Linux test runtime)
        # 1) libsqlite3-dev：sqflite_common_ffi 的 FFI 后端在 Linux 上需要 libsqlite3。
        # 2) GTK / GL / NSS 等：flutter test 在 Linux 上跑 widget / UI 测试需要 GTK-3、
        #    OpenGL、NSS 等图形运行时；ubuntu runner 默认缺失会导致 UI 测试在 CI 上
        #    渲染阶段崩溃（本地 Windows / macOS 因自带图形栈而能过）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            libgtk-3-0 libgl1 libnss3 libxss1 libgbm1 libjsoncpp-dev

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos

      - name: Test
        # 测试套件约 300+ 项；flutter_test_config.dart 已全局把 databaseFactory 切到
        # FFI 真 SQLite，不依赖 Android/iOS 原生加密插件（Linux CI 无该原生实现）。
        run: flutter test

  # ---------------------------------------------------------------------------
  # 2) 生产构建可编译性校验（Android）
  #    无签名密钥时回退 debug 签名，仅验证 release 构建链路能跑通。
  #    同时产出 APK（侧载/分发验证）与 AAB（Google Play 上架标准产物）。
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (release, verify compile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Android SDK & NDK (use runner's preinstalled SDK)
        # GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 已设）。
        # 不再使用 android-actions/setup-android@v3：该 action 会尝试安装已被仓库
        # 移除的 legacy 'tools' 包，报 "Failed to find package 'tools'" 而失败。
        # 这里直接用内置 sdkmanager 接受许可证，并安装 NDK 与 compileSdk 平台
        # （Flutter 3.47.9 -> compileSdk/targetSdk=36，ndkVersion=28.2.13676358）。
        run: |
          # 动态定位 sdkmanager（runner 的 cmdline-tools 子目录可能是 latest 或版本号如 16.0）。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          export PATH="$(dirname "$SDKMGR"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;${{ env.NDK_VERSION }}"

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (no signing -> debug-sign fallback)
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store artifact)
        run: flutter build appbundle --release

      - name: Upload APK artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload AAB artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) 生产构建可编译性校验（iOS）
  #    使用 --no-codesign 仅做编译校验，不产出可上架的签名包；
  #    真机/App Store 签名需在本地 macOS + Xcode 配置 Development Team。
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (release, verify compile)
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: "flutter-${{ env.FLUTTER_VERSION }}-pub-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install CocoaPods
        # GitHub macOS runner 未必预装 cocoapods，flutter build ios 需要它执行 pod install。
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Enable iOS build target
        # macOS runner 上需显式开启 iOS 构建支持，否则 flutter build ios 直接报错。
        run: flutter config --enable-ios

      - name: Accept Xcode license
        # 未授权的 Xcode 会让 xcodebuild / flutter build ios 失败；CI 上必须主动接受。
        run: sudo xcodebuild -license accept

      - name: Pub get
        run: flutter pub get

      - name: Provide llama.cpp source for iOS native build
        # 关键背景（否则 build-ios 必败，报 "Missing native library llama.framework"
        # 然后 "Failed to build llama.cpp for ios-arm64"）：
        #   - llm_llamacpp 0.7.0 的 iOS 预编译包（release 0.7.0 的 ios-arm64 产物，
        #     见 github.com/brynjen/dart-llm/releases/tag/0.7.0）本身缺失 llama.framework，
        #     因此 hook 下载解压后判定该预编译包 "unusable"，回退到源码构建。
        #   - 但 pub.dev 发布的包不含 llamacpp/ 子模块（上游 README 明确说明），
        #     源码构建分支又要求在该目录下找到 llama.cpp 源码，于是 CI 上两条路都走不通。
        # 解决办法：把上游在 0.7.0 标签锁定的 llama.cpp 提交克隆进包的 llamacpp/ 目录，
        # 让 hook 走「源码构建」分支（与 build-release.yaml 产出预编译包用的是同一套
        # CMake 逻辑），在 macOS runner 上就地编译出可用的 llama.framework。
        # 该提交即 packages/llm_llamacpp/llamacpp 子模块在 0.7.0 标签的锁定 commit。
        env:
          LLAMACPP_COMMIT: "25ae3a9b331fffea50ff8d07a5cad34c33f1276f"
        run: |
          # 源码构建需要 CMake；macOS runner 通常预装，缺失时再装。
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version
          # 定位 pub 缓存中的 llm_llamacpp 包目录（flutter-action 默认在 ~/ .pub-cache）。
          PKG=$(find "$HOME/.pub-cache" -type d -name 'llm_llamacpp-0.7.0' | head -1)
          echo "llm_llamacpp package dir: $PKG"
          if [ -z "$PKG" ]; then
            echo "::error::llm_llamacpp package not found in pub cache"
            exit 1
          fi
          # 若 llamacpp/ 子模块不存在，则按锁定 commit 浅克隆进来（blob 惰性下载，省时）。
          if [ ! -e "$PKG/llamacpp/CMakeLists.txt" ]; then
            rm -rf "$PKG/llamacpp"
            git clone --filter=blob:none --no-checkout \
              https://github.com/ggml-org/llama.cpp.git "$PKG/llamacpp"
            git -C "$PKG/llamacpp" fetch --depth 1 origin "$LLAMACPP_COMMIT"
            git -C "$PKG/llamacpp" checkout "$LLAMACPP_COMMIT"
          else
            echo "llama.cpp source already present, skipping clone"
          fi
          ls "$PKG/llamacpp" | head

      - name: Patch llm_llamacpp hook (iOS framework lookup)
        # 根因：上游 llm_llamacpp 0.7.0 的 _findEntityNamed 用 File(...).existsSync()
        # 之类的方式判定实体存在性，对 iOS 需要的「目录型 framework 包」
        # (llama.framework 是一个目录) 返回 false，于是：
        #   (1) 官方 iOS 预编译包（release 0.7.0 的 ios-arm64 产物，确实存在于
        #       github.com/brynjen/dart-llm/releases，2.77MB）被误判为 unusable；
        #   (2) 源码构建分支就地编译出的 llama.framework 也收集不到，报
        #       "Missing native library llama.framework"。
        # 其它平台（android/linux/macos/windows）需要的都是单个 .so/.dylib/.dll
        # 文件，所以不受影响——这也解释了 iOS 预编译下载量极少、且没人报修。
        # 修复：把 _findEntityNamed 替换为「按 basename 递归匹配、文件或目录都算」，
        # 让 iOS 的 framework 包能被正确找到。对单文件平台无影响；若原函数已正确
        # 则是等价（无害）替换。随后删掉 hooks_runner 缓存，强制用补丁后的源码重编译。
        run: |
          PKG=$(find "$HOME/.pub-cache" -type d -name 'llm_llamacpp-0.7.0' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::llm_llamacpp package not found in pub cache"
            exit 1
          fi
          BUILD_DART="$PKG/hook/build.dart"
          python3 - "$BUILD_DART" <<'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          pat = re.compile(r'_findEntityNamed\s*\(([^)]*)\)\s*\{')
          m = pat.search(src)
          if not m:
              print("::warning::_findEntityNamed not found; skipping patch")
              sys.exit(0)
          params = m.group(1)
          names = []
          for part in params.split(','):
              part = part.strip()
              toks = part.split()
              if toks:
                  names.append(toks[-1])
          dir_name = names[0] if len(names) > 0 else 'dir'
          name_name = names[1] if len(names) > 1 else 'name'
          # 从函数起始 '{' 起做括号配对，定位函数结束 '}'
          brace_start = m.end() - 1
          assert src[brace_start] == '{'
          depth = 0
          i = brace_start
          while i < len(src):
              if src[i] == '{':
                  depth += 1
              elif src[i] == '}':
                  depth -= 1
                  if depth == 0:
                      brace_end = i
                      break
              i += 1
          head = src[m.start():brace_start + 1]
          new_body = (
              "{\n"
              "  // Patched by CI: also match directory-based frameworks (iOS llama.framework).\n"
              "  if (!%s.existsSync()) return null;\n"
              "  for (final entity in %s.listSync(recursive: true)) {\n"
              "    if (p.basename(entity.path) == %s) return entity;\n"
              "  }\n"
              "  return null;\n"
              "}" % (dir_name, dir_name, name_name)
          )
          new_src = src[:m.start()] + head + new_body + src[brace_end + 1:]
          open(path, 'w', encoding='utf-8').write(new_src)
          print("Patched _findEntityNamed (dir param='%s', name param='%s')" % (dir_name, name_name))
          PY
          # 让 hooks runner 用补丁后的源码重新编译（否则会用缓存的 hook.dill）。
          rm -rf .dart_tool/hooks_runner

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build iOS (simulator -> compile verification, no Apple Team needed)
        # 真机/上架需要 Development Team + Provisioning Profile；CI 无 Apple 账号，
        # 改用模拟器构建做编译校验（不需要签名/Team）。历史运行显示原生代码本身
        # 已编译成功（"Xcode build done"），仅「可部署包」步骤要求 Team，模拟器构建绕开它。
        # flutter build ios 内部自动执行 pod install（ios/Podfile 已就位）。
        # 本步骤触发的 native-assets hook 会就地用上面准备的 llama.cpp 源码构建
        # iOS 所需的 llama.framework（无 Apple Team 也能完成编译校验）。
        run: flutter build ios --simulator

      - name: Upload iOS app artifact (verification only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: ignore
