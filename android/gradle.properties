# Gradle 守护进程 JVM 堆：GitHub ubuntu-latest runner 仅 7GB 物理内存，
# 原先的 -Xmx8G 远超可用内存，会被 Linux OOM killer 杀掉守护进程，
# 表现为 CI 上的 "Could not receive a message from the daemon" + "Could not update last-build.bin"。
# 同时移除 -XX:+HeapDumpOnOutOfMemoryError：OOM 时会往 14GB 盘写高达 8GB 堆转储，
# 把磁盘写满进而连缓存文件都写不进去。llamadart 在 Android 上用 NDK 编译 llama.cpp
# 原生库，内存压力比迁移前大，更不能再超配。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# CI 稳健性：禁用守护进程，避免 runner 上守护进程失联（"could not receive a message from the daemon"）。
# 代价仅是本地每次构建多 ~10s 冷启动，影响可忽略。
org.gradle.daemon=false
# 限制并发 worker，压低内存峰值（Kotlin/Java 编译 worker 与 NDK C++ 编译争内存）。
org.gradle.workers.max=2
# 加快构建：开启构建缓存与并行（无守护进程时仍有效）。
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
