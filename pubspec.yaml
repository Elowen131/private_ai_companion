name: private_ai_companion
description: 私人 AI 角色陪伴 App（端侧优先 · 全本地 · 人设稳定 · 长期记忆）脚手架
publish_to: 'none'
version: 0.1.0+1

environment:
  # llamadart 0.17.5 的硬性要求：Dart >= 3.10.7、Flutter >= 3.38.0（iOS 部署目标 16.4+）。
  # 本地与 CI 均使用 Flutter 3.47.9，满足；提高下限避免在不达标的环境误装。
  sdk: '>=3.10.7 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  # 多语言：Material/Cupertino 框架文案（复制/粘贴菜单、系统对话框等）本地化
  flutter_localizations:
    sdk: flutter

  # 依赖注入（轻量、无代码生成）
  get_it: ^9.0.0

  # 本地文件 / 路径
  path_provider: ^2.1.2
  path: ^1.8.3

  # 本地数据库（SQLCipher 透明加密：原生 SQL + 静态加密，避免 build_runner 代码生成依赖）
  # sqflite_sqlcipher 与 sqflite API 兼容，仅 openDatabase 多一个 password 参数；
  # 加密在页级进行，不影响 LIKE 检索等现有查询语义。
  sqflite_sqlcipher: ^3.4.1
  sqflite_common: ^2.5.0   # 直接依赖：使用可设置的全局 databaseFactory（测试夹具替换为 FFI）

  # 数据库加密密钥存储：落到系统安全存储（Android Keystore / iOS Keychain / 桌面 DPAPI）
  flutter_secure_storage: ^11.0.0

  # 工具
  uuid: ^4.3.3

  # 网络（模型按需下载，端侧不打包，见方案 9 / 11）
  http: ^1.2.0
  # 上传样本时给 multipart 分段标注 audio/wav（服务商按 Content-Type 校验）
  http_parser: ^4.0.2
  # SHA-256 流式校验（下载后完整性校验，防模型被篡改）
  crypto: ^3.0.3
  # 端侧 LLM 推理底座（方案 9）：llamadart。
  # 原 llm_llamacpp 0.7.0 的 iOS 原生库路径损坏（预编译包缺 llama.framework、
  # 源码构建不产出 framework 目录、hook 每次强制重下载覆盖缓存），无法在 CI 构建；
  # llamadart 是维护积极的后继包，iOS 走 XCFramework + SwiftPM，device/模拟器均支持，
  # 含 App Store 隐私清单。llamadart_llama_cpp_flutter 为 iOS/macOS 的 SwiftPM 伴侣包。
  llamadart: ^0.17.5
  llamadart_llama_cpp_flutter: ^0.17.3   # iOS/macOS 的 llama.cpp XCFramework 伴侣包
  image_picker: ^1.2.4
  # 加密快照 / 加密导出：AES-256-GCM 标准纯 Dart 实现（无原生库、不增 APK 原生体积）
  pointycastle: ^3.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3   # 仅测试期使用：Linux CI 上以 FFI 真 SQLite 替代原生加密插件（见 flutter_test_config.dart）

flutter:
  uses-material-design: true
  # 只声明真正被代码加载的文件。原先的目录声明会把 3 张从未被 Image.asset /
  # rootBundle 引用的预览图（≈275KB）一并打进 flutter_assets —— Android 的
  # shrinkResources 只裁剪 res/，裁剪不到这里。GGUF / GLB 模型按 PRD 11.3
  # 运行时外置下载，绝不随包。
  assets:
    - assets/models/persona_visual_manifest.json
    - assets/models/cen_youheng_q_portrait.jpg
