name: private_ai_companion
description: 私人 AI 角色陪伴 App（端侧优先 · 全本地 · 人设稳定 · 长期记忆）脚手架
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # 多语言：Material/Cupertino 框架文案（复制/粘贴菜单、系统对话框等）本地化
  flutter_localizations:
    sdk: flutter

  # 依赖注入（轻量、无代码生成）
  get_it: ^7.6.7

  # 本地文件 / 路径
  path_provider: ^2.1.2
  path: ^1.8.3

  # 本地数据库（原生 SQL，避免 build_runner 代码生成依赖）
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3   # 桌面开发期可用 FFI

  # 工具
  uuid: ^4.3.3

  # 网络（模型按需下载，端侧不打包，见方案 9 / 11）
  http: ^1.2.0
  # 上传样本时给 multipart 分段标注 audio/wav（服务商按 Content-Type 校验）
  http_parser: ^4.0.2
  # SHA-256 流式校验（下载后完整性校验，防模型被篡改）
  crypto: ^3.0.3
  llm_llamacpp: ^0.7.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/      # 本地模型占位（GGUF / ONNX，运行时按需下载，不打包进 APK）
    - assets/prompts/     # 系统提示词模板
